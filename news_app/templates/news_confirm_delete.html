{% extends 'base.html' %}

{% block title %}Удалить новость{% endblock %}

{% block content %}
<div class="confirm-delete">
    <h1>Удалить новость?</h1>
    <p>Вы уверены, что хотите удалить новость "<strong>{{ news.title }}</strong>"?</p>
    <p>Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <div class="action-buttons">
            <button type="submit" class="btn-delete">Да, удалить</button>
            <a href="{% url 'news_detail' news.pk %}" class="btn-cancel">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
