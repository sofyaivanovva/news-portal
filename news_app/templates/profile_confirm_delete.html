{% extends 'base.html' %}

{% block title %}Удалить аккаунт{% endblock %}

{% block content %}
<div class="confirm-delete">
    <h1>Удалить аккаунт?</h1>
    <p>Вы уверены, что хотите удалить свой аккаунт?</p>
    <p>Все ваши новости также будут удалены. Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <div class="action-buttons">
            <button type="submit" class="btn-delete">Да, удалить аккаунт</button>
            <a href="{% url 'profile' %}" class="btn-cancel">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
