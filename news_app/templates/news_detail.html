{% extends 'base.html' %}

{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <a href="{% url 'home' %}" class="btn btn-secondary mb-3">← Назад</a>

        <div class="card">
            <div class="card-body">
                <span class="badge bg-secondary">Новость #{{ news.id }}</span>
                <span class="text-muted ms-2">📅 {{ news.date }}</span>

                <h1 class="mt-3">{{ news.title }}</h1>

                <h5 class="text-muted mt-4">Краткое описание:</h5>
                <p class="lead">{{ news.summary }}</p>

                <hr>

                <h5>Полный текст:</h5>
                <p style="white-space: pre-wrap;">{{ news.content }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
